name: Monthly Version Check

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      create_issue:
        description: "Create a GitHub issue when updates are detected"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  PIP_VERSION: "26.2.2"

jobs:
  version-audit:
    name: Audit Dependency Versions
    runs-on: ubuntu-26.04
    outputs:
      action_required: ${{ steps.collect.outputs.action_required }}
      audit_exit: ${{ steps.collect.outputs.audit_exit }}
      partial_failure: ${{ steps.collect.outputs.partial_failure }}
      report_created: ${{ steps.collect.outputs.report_created }}
      title: ${{ steps.metadata.outputs.title }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Configure report metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            title="Monthly Dependency Update Report - $(date -u '+%B %Y')"
          else
            title="On-Demand Dependency Update Report - $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Run reusable version audit
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_TIMESTAMP: ${{ steps.metadata.outputs.timestamp }}
        run: |
          set +e
          python -m tools.version_audit \
            --json version-check-report.json \
            --markdown version-check-summary.md \
            --timestamp "$REPORT_TIMESTAMP" \
            --fail-if-all-sources-fail
          audit_exit=$?
          set -e
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          if [ ! -s version-check-report.json ]; then
            echo "report_created=false" >> "$GITHUB_OUTPUT"
            echo "Version audit did not produce its JSON report." >&2
            exit 0
          fi
          echo "report_created=true" >> "$GITHUB_OUTPUT"
          python - <<'PYTHON'
          import json
          import os

          report = json.load(open("version-check-report.json", encoding="utf-8"))
          summary = report["summary"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"updates_found={str(summary['updates_found']).lower()}\n")
              output.write(f"partial_failure={str(summary['partial_failure']).lower()}\n")
              output.write(
                  f"action_required={str(summary['updates_found'] or summary['partial_failure']).lower()}\n"
              )
              output.write(f"finding_count={summary['total']}\n")
          PYTHON

      - name: Upload version report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-check-${{ github.run_id }}
          path: |
            version-check-report.json
            version-check-summary.md
          retention-days: 30
          if-no-files-found: warn

      - name: Publish run summary
        if: always()
        run: |
          if [ -s version-check-summary.md ]; then
            cat version-check-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Warn on partial source failures
        if: steps.collect.outputs.partial_failure == 'true'
        run: echo "::warning::One or more authoritative version sources could not be resolved; review the report."

      - name: Enforce audit source availability
        if: always() && steps.collect.outputs.audit_exit != '0'
        env:
          AUDIT_EXIT: ${{ steps.collect.outputs.audit_exit }}
        run: |
          echo "::error::Version audit exited with status ${AUDIT_EXIT:-unknown}; diagnostics were uploaded when available."
          exit 1

  issue-maintenance:
    name: Update Version Audit Issue
    needs: version-audit
    if: >-
      always() &&
      needs.version-audit.outputs.report_created == 'true' &&
      (github.event_name == 'schedule' || github.event.inputs.create_issue == 'true')
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Download version report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-check-${{ github.run_id }}

      - name: Create or update GitHub issue
        if: needs.version-audit.outputs.action_required == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_TITLE: ${{ needs.version-audit.outputs.title }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('version-check-summary.md', 'utf8');
            const title = process.env.ISSUE_TITLE;
            const marker = '<!-- openemr-version-audit -->';
            const issueBody = `${marker}\n\n${body}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'version-check',
              per_page: 100
            });
            const existing = issues.find(
              issue => !issue.pull_request && (issue.body || '').includes(marker)
            );
            if (existing) {
              const issue = await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body: issueBody
              });
              core.info(`Updated issue: ${issue.data.html_url}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
                labels: ['dependencies', 'maintenance', 'version-check']
              });
              core.info(`Created issue: ${issue.data.html_url}`);
            }

      - name: Close resolved version audit issue
        if: >-
          needs.version-audit.outputs.action_required == 'false' &&
          needs.version-audit.outputs.audit_exit == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- openemr-version-audit -->';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'version-check',
              per_page: 100
            });
            const existing = issues.find(
              issue => !issue.pull_request && (issue.body || '').includes(marker)
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'The latest version audit found no updates or source failures. Closing as resolved.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`Closed resolved issue: ${existing.html_url}`);
            }
