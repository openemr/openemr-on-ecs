name: CI Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  PIP_VERSION: "26.2.1"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_LINUX_X86_64_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Execute pytest suite with coverage
        run: |
          # Runs tests/ and tools/credential-rotation/tests; scope and the 100% gate live in pyproject.toml.
          pytest \
            --cov \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --maxfail=1 \
            --disable-warnings \
            -n auto \
            -m "not integration and not floci" \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          override_branch: ${{ github.ref_name }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          slug: ${{ github.repository }}

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  knowledge-mcp-tests:
    name: Repository Knowledge MCP
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install development dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test STDIO protocol and safety boundaries
        run: pytest tests/tools/test_knowledge_mcp.py -q

      - name: Validate focused Python changes
        run: |
          ruff format --check tools/_shared.py tools/knowledge_mcp tests/tools/test_knowledge_mcp.py
          ruff check tools/_shared.py tools/knowledge_mcp tests/tools/test_knowledge_mcp.py
          mypy tools/_shared.py tools/knowledge_mcp

  floci-e2e:
    name: Floci Live E2E Emulation
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      # This job is local-emulator-only. It must never receive AWS credentials.
      AWS_EC2_METADATA_DISABLED: "true"
      OPENEMR_FLOCI_IMAGE: "floci/floci:1.6.0@sha256:eab36252ea43a4a73928423f0372219052c5c6f87207f6c4754db14b91d6ed30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify no AWS credentials are present
        shell: bash
        run: |
          if [[ -n "${AWS_ACCESS_KEY_ID:-}" || -n "${AWS_SECRET_ACCESS_KEY:-}" || \
                -n "${AWS_SESSION_TOKEN:-}" || -n "${AWS_PROFILE:-}" ]]; then
            echo "Refusing to run local Floci lifecycle tests with AWS credentials."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Allow Floci local ECR over plain HTTP
        run: |
          # Floci serves ECR at http://<account>.dkr.ecr.<region>.localhost:5100.
          # Docker defaults to HTTPS, so configure the local registry before
          # QEMU/buildx are created and fail closed if Docker cannot restart.
          sudo python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          path = Path("/etc/docker/daemon.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          current: dict[str, object] = {}
          if path.is_file() and path.stat().st_size:
              loaded = json.loads(path.read_text(encoding="utf-8"))
              if isinstance(loaded, dict):
                  current = loaded
          registries = current.get("insecure-registries", [])
          if not isinstance(registries, list):
              registries = []
          required = {
              "123456789012.dkr.ecr.us-east-1.localhost:5100",
              "localhost:5100",
              "127.0.0.1:5100",
          }
          current["insecure-registries"] = sorted({str(item) for item in registries} | required)
          path.write_text(json.dumps(current, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
          sudo systemctl restart docker
          docker info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install pinned dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          pip install -r requirements.txt -r requirements-dev.txt
          npm ci

      - name: Pull pinned Floci image
        run: docker pull "${OPENEMR_FLOCI_IMAGE}"

      - name: Prepare Floci RDS and ElastiCache images
        run: |
          python - <<'PY'
          from tools.live_e2e.floci_images import ensure_floci_runtime_images

          print("prepared:", ", ".join(ensure_floci_runtime_images()))
          PY

      - name: Execute Floci lifecycle suite
        env:
          # This is the only guard that permits the live E2E runner to operate
          # in CI, and the endpoint helper also requires a local Floci URL.
          OPENEMR_FLOCI_E2E: "1"
        run: |
          pytest tests/tools/test_floci_e2e.py -m floci -k "not mocked_runner" --maxfail=1 -q
          pytest tests/tools/test_floci_e2e.py -m floci -k "mocked_runner" --maxfail=1 -q
          pytest tests/tools/test_floci_cdk_deploy.py -m floci --maxfail=1 -q
          pytest tests/tools/test_floci_live_e2e_full.py -m floci --maxfail=1 -q

      - name: Upload Floci lifecycle diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floci-live-e2e-diagnostics
          path: |
            .live-e2e/runs/**
            .live-e2e/preflight/**
          if-no-files-found: ignore
          retention-days: 7

  cdk-synth:
    name: CloudFormation Template Validation
    runs-on: ubuntu-26.04
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install pinned Node.js tools
        run: |
          npm ci

      - name: Audit Node.js dependencies
        run: python scripts/check_npm_audit.py

      - name: Run synthesized stack assertions
        run: |
          pytest -q tests/unit/test_openemr_ecs_stack.py

      - name: Run cdk synth with default config
        env:
          AWS_ACCESS_KEY_ID: "fake"
          AWS_SECRET_ACCESS_KEY: "fake"
          AWS_DEFAULT_REGION: "us-west-2"
          CDK_DEFAULT_REGION: "us-west-2"
        run: |
          npx --no-install cdk synth --no-lookups -c certificate_arn=arn:aws:acm:us-west-2:123456789012:certificate/00000000-0000-0000-0000-000000000000

      - name: Test configuration matrix
        env:
          AWS_ACCESS_KEY_ID: "fake"
          AWS_SECRET_ACCESS_KEY: "fake"
          AWS_DEFAULT_REGION: "us-west-2"
          CDK_DEFAULT_REGION: "us-west-2"
        run: |
          echo "Testing multiple configurations to ensure all features work..."
          python3 scripts/test-cdk-synthesis.py

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build isolated import worker image
        run: docker buildx build --platform linux/arm64 --load --tag openemr-import-worker:ci tools/openemr-import-worker

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: >-
          mypy app.py openemr_ecs/ diagrams/ tools/_shared.py
          tools/version_audit/
          tools/openemr_import/ tools/openemr-import-worker/worker.py
          tools/credential-rotation/src/ scripts/check_npm_audit.py
          scripts/test-cdk-synthesis.py

  security-scan:
    name: Security Scan
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          pip-audit --strict --progress-spinner off \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r tools/credential-rotation/requirements.txt
          pip-audit --strict --progress-spinner off \
            -r tools/openemr-import-worker/requirements.txt

  shellcheck:
    name: Shell Script Validation
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          archive="/tmp/shellcheck.tar.gz"
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --location \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" \
              --output "$archive"; then
              break
            fi
            rm -f "$archive"
            if ((attempt == 4)); then
              echo "Failed to download ShellCheck after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "${SHELLCHECK_LINUX_X86_64_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C /tmp
          sudo install -m 0755 \
            "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run shellcheck on scripts
        run: |
          echo "Running shellcheck on all scripts in scripts/ directory..."
          echo "Excluding acceptable warnings: SC1090,SC1091,SC2015,SC2034,SC2059,SC2317"
          failed=0
          while IFS= read -r -d '' script; do
            echo "Checking $script..."
            if ! shellcheck -e SC1090,SC1091,SC2015,SC2034,SC2059,SC2317 "$script"; then
              echo "❌ Shellcheck found issues in $script"
              failed=1
            fi
          done < <(find scripts/ -name "*.sh" -type f -print0)

          if [ "$failed" -eq 1 ]; then
            echo "❌ Shellcheck validation failed"
            exit 1
          else
            echo "✅ All scripts passed shellcheck validation"
          fi

  go-tui-build:
    name: Build Go TUI
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: scripts/backup-tui

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: scripts/backup-tui/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build TUI binary
        run: make build

      - name: Check binary exists
        run: |
          if [ ! -f bin/backup-tui ]; then
            echo "Error: Binary not found after build"
            exit 1
          fi
          ls -lh bin/backup-tui

  go-tui-lint:
    name: Lint Go TUI
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: scripts/backup-tui

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: scripts/backup-tui/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Error: Code is not formatted. Run 'go fmt ./...' to fix."
            gofmt -s -d .
            exit 1
          fi

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          golangci-lint --version

      - name: Run golangci-lint
        run: |
          set -e
          golangci-lint run --verbose --timeout=5m ./... 2>&1

  go-tui-test:
    name: Test Go TUI
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: scripts/backup-tui

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: scripts/backup-tui/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test ./... -v -coverprofile=coverage.out -covermode=atomic

      - name: Display coverage summary
        run: go tool cover -func=coverage.out

  docker-compose-tests:
    name: Docker Compose Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate basic configuration
        run: |
          echo "Validating basic Docker Compose configuration..."
          cd compose
          docker compose -f docker-compose.test.yml config > /dev/null || exit 1
          echo "✅ Basic configuration is valid"

      - name: Test basic container startup
        timeout-minutes: 5
        run: |
          echo "Testing basic Docker Compose container startup..."
          cd compose
          set -e
          # Start services in detached mode
          echo "Starting containers..."
          docker compose -f docker-compose.test.yml up -d
          # Wait for MySQL to be ready (check logs for ready message)
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml logs mysql-test | grep -qi "ready for connections\|mysqld.*ready"; then
              echo "✅ MySQL is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ MySQL failed to start within timeout"
              docker compose -f docker-compose.test.yml logs mysql-test
              exit 1
            fi
            sleep 2
          done
          # Wait for Redis to be ready
          echo "Waiting for Redis to be ready..."
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T redis-test redis-cli ping 2>/dev/null | grep -q "PONG"; then
              echo "✅ Redis is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Redis failed to start within timeout"
              docker compose -f docker-compose.test.yml logs redis-test
              exit 1
            fi
            sleep 2
          done
          # Wait for OpenEMR container startup script to complete (look for completion message)
          echo "Waiting for OpenEMR container initialization..."
          sleep 15  # Give it time to start
          # Check container status
          echo "Container status:"
          docker compose -f docker-compose.test.yml ps
          # Verify MySQL and Redis are running
          if ! docker compose -f docker-compose.test.yml ps mysql-test | grep -q "Up"; then
            echo "❌ MySQL container is not running"
            docker compose -f docker-compose.test.yml logs mysql-test
            exit 1
          fi
          if ! docker compose -f docker-compose.test.yml ps redis-test | grep -q "Up"; then
            echo "❌ Redis container is not running"
            docker compose -f docker-compose.test.yml logs redis-test
            exit 1
          fi
          # Check OpenEMR container logs for startup completion (it should reach "Container initialization complete")
          echo "OpenEMR container logs (last 50 lines):"
          docker compose -f docker-compose.test.yml logs --tail=50 openemr-test || true
          if docker compose -f docker-compose.test.yml logs openemr-test 2>&1 | grep -q "Container initialization complete"; then
            echo "✅ OpenEMR container startup script completed successfully"
          elif docker compose -f docker-compose.test.yml logs openemr-test 2>&1 | grep -qi "ERROR"; then
            echo "❌ OpenEMR container startup script encountered errors"
            docker compose -f docker-compose.test.yml logs openemr-test
            exit 1
          else
            echo "⚠️  OpenEMR container may still be initializing (this is acceptable for CI test)"
          fi
          echo "✅ Basic container startup test passed"

      - name: Cleanup basic test
        if: always()
        run: |
          cd compose
          docker compose -f docker-compose.test.yml down -v || true

      - name: Validate SSL configuration
        run: |
          echo "Validating SSL Docker Compose configuration..."
          cd compose
          docker compose -f docker-compose.test-ssl.yml config > /dev/null || exit 1
          echo "✅ SSL configuration is valid"

      - name: Test SSL container startup
        timeout-minutes: 5
        run: |
          echo "Testing SSL Docker Compose container startup..."
          cd compose
          set -e
          # Start services in detached mode
          echo "Starting containers..."
          docker compose -f docker-compose.test-ssl.yml up -d
          # Wait for MySQL to be ready
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if docker compose -f docker-compose.test-ssl.yml logs mysql-test-ssl | grep -qi "ready for connections\|mysqld.*ready"; then
              echo "✅ MySQL is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ MySQL failed to start within timeout"
              docker compose -f docker-compose.test-ssl.yml logs mysql-test-ssl
              exit 1
            fi
            sleep 2
          done
          # Wait for Redis to be ready (with TLS)
          echo "Waiting for Redis to be ready..."
          for i in {1..30}; do
            if docker compose -f docker-compose.test-ssl.yml exec -T redis-test-ssl redis-cli --tls --cert /etc/redis/ssl/server-cert.pem --key /etc/redis/ssl/server-key.pem --cacert /etc/redis/ssl/ca-cert.pem -p 6380 ping 2>/dev/null | grep -q "PONG"; then
              echo "✅ Redis is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Redis failed to start within timeout"
              docker compose -f docker-compose.test-ssl.yml logs redis-test-ssl
              exit 1
            fi
            sleep 2
          done
          # Wait for OpenEMR container startup script to complete
          echo "Waiting for OpenEMR container initialization..."
          sleep 15  # Give it time to start
          # Check container status
          echo "Container status:"
          docker compose -f docker-compose.test-ssl.yml ps
          # Verify MySQL and Redis are running
          if ! docker compose -f docker-compose.test-ssl.yml ps mysql-test-ssl | grep -q "Up"; then
            echo "❌ MySQL container is not running"
            docker compose -f docker-compose.test-ssl.yml logs mysql-test-ssl
            exit 1
          fi
          if ! docker compose -f docker-compose.test-ssl.yml ps redis-test-ssl | grep -q "Up"; then
            echo "❌ Redis container is not running"
            docker compose -f docker-compose.test-ssl.yml logs redis-test-ssl
            exit 1
          fi
          # Check OpenEMR container logs for startup completion
          echo "OpenEMR container logs (last 50 lines):"
          docker compose -f docker-compose.test-ssl.yml logs --tail=50 openemr-test-ssl || true
          if docker compose -f docker-compose.test-ssl.yml logs openemr-test-ssl 2>&1 | grep -q "Container initialization complete"; then
            echo "✅ OpenEMR SSL container startup script completed successfully"
          elif docker compose -f docker-compose.test-ssl.yml logs openemr-test-ssl 2>&1 | grep -qi "ERROR"; then
            echo "❌ OpenEMR SSL container startup script encountered errors"
            docker compose -f docker-compose.test-ssl.yml logs openemr-test-ssl
            exit 1
          else
            echo "⚠️  OpenEMR SSL container may still be initializing (this is acceptable for CI test)"
          fi
          echo "✅ SSL container startup test passed"

      - name: Cleanup SSL test
        if: always()
        run: |
          cd compose
          docker compose -f docker-compose.test-ssl.yml down -v || true

  import-worker-mysql-integration:
    name: Import Worker MySQL Integration
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run live TLS MySQL import-worker harness
        env:
          IMPORT_CI_WAIT_SECONDS: "1200"
        run: ./scripts/ci-import-worker-mysql.sh

      - name: Upload import-worker MySQL diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-worker-mysql-ci-logs
          path: .import-worker-mysql-ci/logs/
          if-no-files-found: ignore

  import-worker-seed-manifest:
    name: Import Worker Seed Manifest Freshness
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check fresh-seed manifest against the pinned OpenEMR image
        env:
          IMPORT_CI_WAIT_SECONDS: "1200"
        run: ./scripts/update-seed-manifest.sh --check

      - name: Upload seed-manifest diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seed-manifest-ci-logs
          path: .seed-manifest-ci/logs/
          if-no-files-found: ignore
